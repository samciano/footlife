<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Carreira Futebolística</title>
</head>
<body>
    <h1>⚽ Minha Carreira</h1>
    
    <div class="card">
        <h2>{{ jogador.nome }}</h2>
        <p><strong>Posição:</strong> {{ jogador.posicao }}</p>
        <p><strong>Idade:</strong> {{ jogador.idade }}</p>
        <p><strong>Finalização:</strong> {{ jogador.finalizacao }}</p>
        <p><strong>Passe:</strong> {{ jogador.passe }}</p>
        <p><strong>Energia:</strong> {{ jogador.energia }}</p>
    </div>

    <form action="/treinar" method="post">
        <button type="submit">⚡ Treinar Finalização</button>
    </form>

    <hr>
    <p style="color: gray;">Versão 0.1 - Carreira Profissional</p>
</body>
</html>
