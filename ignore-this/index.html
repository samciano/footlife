<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Minimalista</title>
  <style>
    :root {
      /* Palette Dark Mode */
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Grid Layout principal */
    .dashboard {
      display: grid;
      grid-template-columns: 220px 1fr 280px;
      grid-template-rows: auto auto;
      gap: 16px;
      width: 100%;
      max-width: 1200px;
    }

    /* Estilo padrão de Card */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .card.dashed {
      border: 2px dashed var(--card-border);
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* Coluna da Esquerda (Settings) */
    .settings-card {
      grid-row: span 1;
    }

    .settings-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .settings-list li {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: 0.2s;
    }

    .settings-list li:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
    }

    /* Centro: Seção Principal */
    .center-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .current-match {
      height: 220px;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .match-controls {
      display: flex;
      gap: 8px;
      align-self: flex-end;
    }

    .control-btn {
      background: var(--card-border);
      border: none;
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .control-btn:hover {
      background: var(--accent-color);
      color: #000;
    }

    .banner-card {
      height: 100px;
      justify-content: center;
      align-items: center;
    }

    /* Coluna da Direita (Perfil / Info) */
    .profile-card {
      align-items: center;
      text-align: center;
      gap: 16px;
    }

    .avatar-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }

    .avatar-icon svg {
      width: 36px;
      height: 36px;
      fill: var(--text-muted);
    }

    .profile-subbox {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed var(--card-border);
      border-radius: 8px;
      padding: 12px;
      text-align: left;
    }

    /* Fileira Inferior (4 colunas) */
    .bottom-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .bottom-card {
      min-height: 120px;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <!-- Menu Lateral (Esquerda) -->
    <div class="card settings-card">
      <ul class="settings-list" id="settingsList"></ul>
    </div>

    <!-- Centro (Jogo Atual + Banner) -->
    <div class="center-column">
      <div class="card current-match">
        <div class="card-title" id="txt-current-match"></div>
        <div class="match-controls">
          <button class="control-btn">▶</button>
          <button class="control-btn">⏩</button>
        </div>
      </div>
      <div class="card banner-card">
        <span id="txt-banner" style="color: var(--text-muted);"></span>
      </div>
    </div>

    <!-- Coluna Direita (User Profile) -->
    <div class="card profile-card">
      <div class="avatar-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      <div class="profile-subbox">
        <div class="card-title" id="txt-profile-title"></div>
        <p id="txt-profile-desc" style="font-size: 0.85rem; color: var(--text-muted);"></p>
      </div>
    </div>

    <!-- Fileira Inferior -->
    <div class="bottom-row">
      <div class="card dashed bottom-card">
        <div class="card-title" id="txt-season-stats"></div>
      </div>
      <div class="card dashed bottom-card">
        <div class="card-title" id="txt-league-cup"></div>
      </div>
      <div class="card dashed bottom-card">
        <div class="card-title" id="txt-news"></div>
      </div>
      <div class="card dashed bottom-card">
        <div class="card-title" id="txt-msg"></div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    //  VARIÁVEIS DE TEXTO (ALTERE AQUI OS TEXTOS)
    // ==========================================
    const TEXTOS = {
      settingsItems: [
        "SETTINGS 1",
        "SETTINGS 2",
        "SETTINGS 3",
        "SETTINGS 4",
        "SETTINGS 5",
        "SETTINGS 6"
      ],
      currentMatch: "CURRENT MATCH",
      bannerText: "ÁREA DE BANNER / DESTAQUE",
      profileTitle: "PERFIL DO JOGADOR",
      profileDesc: "Informações extras do perfil entram aqui...",
      seasonStats: "SEASON STATS",
      leagueCup: "LEAGUE / CUP",
      news: "NEWS",
      msg: "MSG"
    };

    // ==========================================
    //  INJEÇÃO AUTOMÁTICA DOS TEXTOS NO LAYOUT
    // ==========================================
    document.getElementById("txt-current-match").textContent = TEXTOS.currentMatch;
    document.getElementById("txt-banner").textContent = TEXTOS.bannerText;
    document.getElementById("txt-profile-title").textContent = TEXTOS.profileTitle;
    document.getElementById("txt-profile-desc").textContent = TEXTOS.profileDesc;
    document.getElementById("txt-season-stats").textContent = TEXTOS.seasonStats;
    document.getElementById("txt-league-cup").textContent = TEXTOS.leagueCup;
    document.getElementById("txt-news").textContent = TEXTOS.news;
    document.getElementById("txt-msg").textContent = TEXTOS.msg;

    // Renderiza a lista do menu
    const settingsUl = document.getElementById("settingsList");
    TEXTOS.settingsItems.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item;
      settingsUl.appendChild(li);
    });
  </script>
</body>
</html>
